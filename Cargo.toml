[package]
name = "anime-music-player"
version = "1.0.0"
edition = "2021"
description = "Anime-themed music player web application"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-multipart = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "server"
path = "src/main.rs"
