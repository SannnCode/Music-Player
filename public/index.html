<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anime Music Player - Pemutar musik dengan estetika anime">
  <title>MPLayer by SannnCode</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'outfit': ['Outfit', 'sans-serif'],
          },
          colors: {
            'anime-gray': '#e5e7eb',
            'glass-border': 'rgba(255, 255, 255, 0.1)',
          }
        }
      }
    }
  </script>
</head>

<body class="font-outfit h-screen overflow-hidden bg-black text-white">

  <!-- Video/Image Background -->
  <div id="background-container" class="fixed inset-0 z-0">
    <video id="bg-video" class="w-full h-full object-cover" autoplay loop muted playsinline>
      <source src="" type="video/mp4">
    </video>
    <img id="bg-image" class="w-full h-full object-cover hidden" src="" alt="Background">
    <div class="absolute inset-0 bg-black/40"></div>
  </div>

  <!-- Main Container -->
  <div class="relative z-10 h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <!-- Player Card -->
    <div class="glass-card w-full max-w-7xl h-[90vh] flex flex-col rounded-3xl p-4 md:p-6 overflow-hidden">

      <!-- Header -->
      <div class="grid grid-cols-3 items-center mb-4 w-full relative z-20 hover:z-30">
        <div></div> <!-- Spacer for balance -->
        <h1
          class="text-2xl md:text-3xl font-bold text-white flex items-center justify-center gap-2 text-shadow text-center">
          <span class="text-3xl"></span> Music Player
        </h1>
        <div class="flex gap-2 justify-end">
          <button id="song-list-btn" class="p-2 rounded-full hover:bg-white/10 transition-colors" title="Daftar Lagu">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <button id="settings-btn" class="p-2 rounded-full hover:bg-white/10 transition-colors" title="Settings">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
              </path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
              </path>
            </svg>
          </button>
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-6 flex-1 min-h-0 w-full">

        <!-- Now Playing Section -->
        <div class="flex flex-col items-center justify-center h-full overflow-y-auto custom-scrollbar relative">
          <!-- Album Art -->
          <div class="relative group">
            <div id="album-art-container"
              class="w-20 h-20 md:w-28 md:h-28 flex-shrink-0 rounded-full bg-gradient-to-br from-gray-800 to-black flex items-center justify-center mb-2 shadow-xl album-art overflow-hidden bg-cover bg-center border border-white/10 relative">
              <span class="text-4xl md:text-5xl">🎧</span>
            </div>
            <!-- Upload Overlay -->
            <div
              class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-black/50 rounded-2xl cursor-pointer"
              id="upload-art-btn">
              <span class="text-white text-sm font-medium">📷 Upload Art</span>
            </div>
            <input type="file" id="album-art-input" class="hidden" accept="image/*">
          </div>

          <!-- Lyrics Container moved to right column -->

          <!-- Song Info -->
          <div class="text-center mb-2">
            <h2 id="song-title" class="text-lg md:text-xl font-semibold text-white mb-1">Pilih Lagu</h2>
            <p id="song-artist" class="text-white/60 text-sm">-</p>
          </div>

          <!-- Progress Bar -->
          <div class="w-full mb-3 max-w-md">
            <div class="progress-container h-2 bg-white/20 rounded-full cursor-pointer" id="progress-container">
              <div id="progress-bar"
                class="h-full bg-anime-gray shadow-[0_0_10px_#e5e7eb] rounded-full transition-all duration-150"
                style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-sm text-white/60 mt-1">
              <span id="current-time">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <!-- Controls -->
          <div class="flex items-center gap-3 mb-4">
            <!-- Shuffle Button -->
            <button id="shuffle-btn" class="control-btn p-2 rounded-full hover:bg-white/20 transition-all" title="Shuffle (S)">
              <svg class="w-5 h-5 text-white/50" fill="currentColor" viewBox="0 0 24 24">
                <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
              </svg>
            </button>
            
            <button id="prev-btn" class="control-btn p-3 rounded-full hover:bg-white/20 transition-all" title="Previous (←)">
              <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
              </svg>
            </button>
            <button id="play-btn"
              class="play-btn p-3 rounded-full border border-anime-gray hover:scale-110 transition-transform shadow-lg group" title="Play/Pause (Space)">
              <svg id="play-icon" class="w-6 h-6 text-anime-gray drop-shadow-[0_0_5px_#e5e7eb]" fill="currentColor"
                viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
              </svg>
              <svg id="pause-icon" class="w-8 h-8 text-anime-gray drop-shadow-[0_0_5px_#e5e7eb] hidden"
                fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
              </svg>
            </button>
            <button id="next-btn" class="control-btn p-3 rounded-full hover:bg-white/20 transition-all" title="Next (→)">
              <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
              </svg>
            </button>
            
            <!-- Repeat Button -->
            <button id="repeat-btn" class="control-btn p-2 rounded-full hover:bg-white/20 transition-all" title="Repeat (R)">
              <svg id="repeat-icon-off" class="w-5 h-5 text-white/50" fill="currentColor" viewBox="0 0 24 24">
                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
              </svg>
              <svg id="repeat-icon-all" class="w-5 h-5 text-white hidden" fill="currentColor" viewBox="0 0 24 24">
                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
              </svg>
              <svg id="repeat-icon-one" class="w-5 h-5 text-white hidden" fill="currentColor" viewBox="0 0 24 24">
                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                <text x="12" y="14.5" text-anchor="middle" font-size="7" font-weight="bold" fill="currentColor">1</text>
              </svg>
            </button>
          </div>

          <!-- Volume Control -->
          <div class="flex items-center gap-3 w-full max-w-xs">
            <svg class="w-5 h-5 text-white/70" fill="currentColor" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
            </svg>
            <input type="range" id="volume-slider" min="0" max="100" value="75" class="volume-slider flex-1">
            <span id="volume-value" class="text-white/70 text-sm w-8">75%</span>
          </div>
        </div>

        <!-- Lyrics Section (Right Column) -->
        <div class="flex flex-col h-full rounded-2xl p-4">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-white/50">Lirik Lagu</h3>
            <button id="edit-lyrics-btn" class="text-xs text-anime-pink hover:text-anime-purple hover:underline">
              Edit Lirik
            </button>
          </div>

          <div id="lyrics-container" class="flex-1 w-full bg-transparent overflow-hidden relative mask-gradient">
            <div
              class="absolute inset-0 w-full h-full overflow-y-auto custom-scrollbar no-scrollbar text-center flex flex-col items-center scroll-smooth text-sm"
              id="lyrics-text">
              <span class="text-white/40 italic my-auto">Putar lagu untuk melihat lirik</span>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Song List Modal -->
  <div id="song-list-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 modal-overlay glass-overlay"></div>
    <div class="glass-card relative rounded-3xl p-6 w-full max-w-md max-h-[80vh] flex flex-col slide-up-animation">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">
          <span>📋</span> Playlist
        </h3>
        <button id="close-song-list"
          class="p-2 rounded-full hover:bg-white/10 text-white/60 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Genre Filter Chips -->
      <div id="genre-filter-container" class="flex flex-wrap gap-2 mb-3">
        <!-- Genre chips will be added dynamically -->
      </div>

      <div id="song-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-2">
        <!-- Songs will be loaded here -->
        <div class="text-white/50 text-center py-8">Loading...</div>
      </div>

      <!-- Upload Song -->
      <div class="mt-3 pt-3 border-t border-white/10">
        <input type="file" id="upload-song-input" accept=".mp3,.webm" class="hidden">
        <button id="upload-song-btn"
          class="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white font-medium transition-all flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-8-8l-4 4m4-4l4 4m-4-4v12"></path>
          </svg>
          Upload Lagu
        </button>
      </div>
    </div>
  </div>

  <!-- Edit Song Modal -->
  <div id="edit-song-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 edit-song-overlay"></div>
    <div class="glass-card relative rounded-2xl p-6 w-full max-w-sm">
      <h3 class="text-xl font-semibold text-white mb-4">✏️ Edit Lagu</h3>

      <div class="mb-3">
        <label class="text-white/70 text-sm mb-1 block">Judul</label>
        <input type="text" id="edit-song-title"
          class="w-full bg-black/20 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-white/30">
      </div>

      <div class="mb-3">
        <label class="text-white/70 text-sm mb-1 block">Artis</label>
        <input type="text" id="edit-song-artist"
          class="w-full bg-black/20 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-white/30">
      </div>

      <div class="mb-4">
        <label class="text-white/70 text-sm mb-1 block">Genre</label>
        <select id="edit-song-genre"
          class="w-full bg-black/20 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-white/30">
          <option value="">-- Pilih Genre --</option>
        </select>
      </div>

      <div class="flex gap-2">
        <button id="cancel-edit-song"
          class="flex-1 py-2 rounded-lg bg-white/10 text-white font-medium hover:bg-white/20 transition-colors">
          Batal
        </button>
        <button id="save-edit-song"
          class="flex-1 py-2 rounded-lg bg-white/20 hover:bg-white/30 text-white font-medium transition-all">
          Simpan
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 modal-overlay" id="settings-overlay"></div>
    <div class="glass-card relative rounded-2xl p-6 w-full max-w-md">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-semibold text-white">⚙️ Pengaturan</h3>
        <button id="close-settings-x"
          class="p-2 rounded-full hover:bg-white/10 text-white/60 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Tabs -->
      <div class="flex gap-2 mb-4 border-b border-white/10">
        <button id="tab-background"
          class="px-3 py-2 text-white/80 border-b-2 border-white font-medium">Background</button>
        <button id="tab-genres"
          class="px-3 py-2 text-white/50 hover:text-white/80 border-b-2 border-transparent">Genre</button>
      </div>

      <!-- Background Tab Content -->
      <div id="tab-content-background" class="mb-4">
        <label class="text-white/80 text-sm mb-2 block">Pilih Background</label>
        <div id="background-list" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto custom-scrollbar">
          <!-- Backgrounds will be loaded here -->
        </div>
        <div class="mt-2 text-right">
          <input type="file" id="upload-background-input" accept="image/*,video/mp4,video/webm" class="hidden">
          <button id="upload-background-btn"
            class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-sm font-medium transition-colors flex items-center gap-2 ml-auto">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-8-8l-4 4m4-4l4 4m-4-4v12"></path>
            </svg>
            Upload Background
          </button>
        </div>
      </div>

      <!-- Genre Tab Content -->
      <div id="tab-content-genres" class="mb-4 hidden">
        <label class="text-white/80 text-sm mb-2 block">Kelola Genre</label>
        <div id="genre-list" class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar mb-3">
          <!-- Genres will be loaded here -->
        </div>
        <div class="flex gap-2">
          <input type="text" id="new-genre-input" placeholder="Nama genre baru..."
            class="flex-1 bg-black/20 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-white/30">
          <button id="add-genre-btn"
            class="px-4 py-2 rounded-lg bg-white/20 hover:bg-white/30 text-white text-sm font-medium transition-all">
            + Tambah
          </button>
        </div>
      </div>

      <button id="close-settings"
        class="w-full py-2 rounded-lg bg-white/20 hover:bg-white/30 text-white font-medium transition-all border border-white/10">
        Tutup
      </button>
    </div>
  </div>

  <!-- Lyrics Modal -->
  <div id="lyrics-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 lyrics-modal-overlay"></div>
    <div class="glass-card relative rounded-2xl p-6 w-full max-w-md">
      <h3 class="text-xl font-semibold text-white mb-4">📝 Edit Lirik</h3>

      <textarea id="lyrics-input"
        class="w-full h-48 bg-black/20 rounded-lg p-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-anime-pink mb-4 custom-scrollbar"
        placeholder="Tempel lirik di sini..."></textarea>

      <div class="flex gap-2">
        <button id="cancel-lyrics-btn"
          class="flex-1 py-2 rounded-lg bg-white/10 text-white font-medium hover:bg-white/20 transition-colors">
          Batal
        </button>
        <button id="save-lyrics-btn"
          class="flex-1 py-2 rounded-lg bg-gradient-to-r from-anime-pink to-anime-purple text-white font-medium hover:opacity-90 transition-opacity">
          Simpan
        </button>
      </div>
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="audio-player" preload="metadata"></audio>

  <!-- JavaScript -->
  <script src="/js/app.js"></script>
</body>

</html>
